name: Update GOV.UK knowledge weekly

# Refreshes the chat agent's GOV.UK knowledge base (agent/knowledge/govuk/*.json) from the official
# GOV.UK Content API. Only changed pages are re-embedded (free gte-small edge function). No database
# is touched; Vercel redeploys automatically when the files change.

on:
  schedule:
    # Every Monday at 04:30 UTC
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        # Pin to a commit SHA (as checkout is) once the team confirms the hash.
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge base
        env:
          # Repository secrets (never commit these values).
          SOC_EMBED_FUNCTION_URL: ${{ secrets.SOC_EMBED_FUNCTION_URL }}
          SOC_EMBED_SECRET: ${{ secrets.SOC_EMBED_SECRET }}
        run: npx ts-node --transpile-only scripts/agent/buildGovukKnowledge.ts

      - name: Check if files changed
        id: git-check
        run: |
          git diff --quiet -- agent/knowledge/govuk || echo "changed=true" >> $GITHUB_OUTPUT
          git ls-files --others --exclude-standard -- agent/knowledge/govuk | grep -q . && echo "changed=true" >> $GITHUB_OUTPUT || true

      - name: Commit & push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent/knowledge/govuk
          git commit -m "chore: auto-update GOV.UK knowledge"
          git push
